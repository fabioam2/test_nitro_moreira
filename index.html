<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Moreira! 11</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 800;
      background: linear-gradient(135deg, #14C76E 0%, #426DFF 50%, #14C76E 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 4s ease infinite;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: #555;
      margin-top: 1rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px; height: 400px;
      background: #14C76E;
      top: -100px; left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px; height: 300px;
      background: #426DFF;
      bottom: -80px; right: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 200px; height: 200px;
      background: #EC4E4E;
      top: 50%; right: 10%;
      animation-delay: -2s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .pulse {
      display: inline-block;
      width: 12px; height: 12px;
      background: #14C76E;
      border-radius: 50%;
      margin-right: 0.5rem;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <h1>Hello Moreira! 10</h1>
    <p class="subtitle">21/05/2026 às 13:27:18</p>
    <p class="subtitle">21/05/2026 às 13:27:18</p>
    <p class="subtitle"><span class="pulse"></span>powered by nitro</p>
  </div>
</body>
</html>
